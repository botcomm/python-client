[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "botcomm"
version = "0.1.0"
description = "Python SDK for building BotComm bots"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://botcomm.app"
Repository = "https://github.com/botcomm/python-client"

[tool.setuptools.packages.find]
include = ["botcomm*"]
